spring:
  application:
    name: assembleia
  datasource:
    url: jdbc:h2:file:/data/assembleia
    username: sa
    password: password
    driverClassName: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate.ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console

api:
  user-info:
    host: https://user-info.herokuapp.com
    base-path: /users/{cpf}
    consumer-key:
